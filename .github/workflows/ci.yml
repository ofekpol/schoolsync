name: CI

# PRs only: the merge into staging/main is the code the PR already tested.
on:
  pull_request:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_gantt_test
  # lib/db/client.ts reads DATABASE_URL — point the production client at the same ephemeral DB
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_gantt_test

jobs:
  checks:
    name: Lint, Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Typecheck (tsc --noEmit)
        run: pnpm tsc --noEmit

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_gantt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Prepare database (roles, migrations, grants)
        run: bash scripts/ci-db-setup.sh
      - name: Unit + integration tests (Vitest)
        # seed.test.ts calls seedDb() with a deterministic UUID stub, so no Supabase Auth project is needed.
        run: pnpm test

  e2e:
    name: Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Prepare database (roles, migrations, grants)
        run: bash scripts/ci-db-setup.sh

      - name: Cache Next.js build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'messages/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        # SKIP_MIGRATIONS=1: the database step already applied migrations; prebuild would replay them and fail.
        env:
          SKIP_MIGRATIONS: "1"
        run: pnpm build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        # The project's own Playwright version, so the browser build matches what tests launch.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: "E2E: demo sandbox (Playwright)"
        # Always runs: the demo flow needs only the CI Postgres and a test-only secret.
        run: pnpm playwright test/e2e/demo.spec.ts
        env:
          CI: "true"
          DEMO_SESSION_SECRET: ci-only-demo-session-secret-not-used-anywhere-else
          PLAYWRIGHT_WEB_COMMAND: pnpm start

      - name: E2E tests (Playwright)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: pnpm playwright
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
